<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Joaquin Avellan</title><desc id="d">A garden at moonrise: terraced hills, small greenhouses with lit windows, a pond holding the moon's light.</desc>
<style>
.hz{animation:pulse 9s ease-in-out infinite;transform-origin:944px 118px}
.wd{animation:pulse 13s ease-in-out infinite reverse;transform-origin:944px 118px}
.ff{animation:drift 11s ease-in-out infinite} .f1{animation-duration:14s;animation-delay:-3s} .f2{animation-duration:9s;animation-delay:-6s} .f3{animation-duration:16s;animation-delay:-9s}
.ff circle:first-child{animation:blink 4s ease-in-out infinite}
.gl{animation:shimmer 5s ease-in-out infinite} .g1{animation-delay:-1s} .g2{animation-delay:-2.2s} .g3{animation-delay:-3.1s} .g4{animation-delay:-4s}
.tw{animation:twinkle 6s ease-in-out infinite} .t1{animation-delay:-1.5s} .t2{animation-delay:-3s} .t3{animation-delay:-4.5s}
.cl{animation:cloud 60s ease-in-out infinite alternate}
.wl{animation:pulse 7s ease-in-out infinite;transform-origin:1124px 271px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.82}}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-12px)}50%{transform:translate(4px,-26px)}75%{transform:translate(-12px,-10px)}}
@keyframes blink{0%,100%{opacity:.1}50%{opacity:.28}}
@keyframes shimmer{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes cloud{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
